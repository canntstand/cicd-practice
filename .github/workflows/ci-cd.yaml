name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code & Config Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yamllint
        uses: karancode/yamllint-github-action@v2.1.1
        with:
          yamllint_file_or_dir: "docker-compose.yml"
          yamllint_strict: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Ruff (Linter)
        run: |
          pip install ruff
          ruff check .

  tests:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << EOF > .env
          TEST_DB_NAME=${{ vars.TEST_DB_NAME || 'test_db' }}
          DB_NAME=${{ vars.DB_NAME || 'main_db' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD || 'example123' }}
          POSTGRES_USER=${{ vars.POSTGRES_USER || 'example' }}
          TEST_DB_URL=postgresql://${{ vars.POSTGRES_USER || 'example' }}:${{ secrets.DB_PASSWORD || 'example123' }}@test_db:5432/${{ vars.TEST_DB_NAME || 'test_db' }}
          DB_URL=postgresql://${{ vars.POSTGRES_USER || 'example' }}:${{ secrets.DB_PASSWORD || 'example123' }}@main_db:5432/${{ vars.DB_NAME || 'main_db' }}
          SECRET_KEY=${{ secrets.SECRET_KEY || 'example_key' }}
          REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY || 'example_refresh' }}
          ALGORITHM=${{ vars.ALGORITHM || 'HS256' }}
          REFRESH_ALGORITHM=${{ vars.REFRESH_ALGORITHM || 'HS256' }}
          TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_MINUTES=1440
          PGADMIN_DEFAULT_EMAIL=admin@example.com
          PGADMIN_DEFAULT_PASSWORD=example123
          EOF

      - name: Start services
        run: docker compose up -d --wait main_db test_db

      - name: Run tests via Docker Compose
        run: docker compose run --rm tests

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Security audit for dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
          ignore-vulns: PYSEC-2026-1325 # игнорируем ecdsa уязвимость т.к апдейтов нет и является зависимостью python-jose

      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          path: "backend"

  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/cicd-practice
            git pull origin main

            cat << EOF > .env
            TEST_DB_NAME=${{ vars.TEST_DB_NAME || 'test_db' }}
            DB_NAME=${{ vars.DB_NAME || 'main_db' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || 'example123' }}
            POSTGRES_USER=${{ vars.POSTGRES_USER || 'example' }}
            TEST_DB_URL=postgresql://${{ vars.POSTGRES_USER || 'example' }}:${{ secrets.DB_PASSWORD || 'example123' }}@test_db:5432/${{ vars.TEST_DB_NAME || 'test_db' }}
            DB_URL=postgresql://${{ vars.POSTGRES_USER || 'example' }}:${{ secrets.DB_PASSWORD || 'example123' }}@main_db:5432/${{ vars.DB_NAME || 'main_db' }}
            SECRET_KEY=${{ secrets.SECRET_KEY || 'example_key' }}
            REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY || 'example_refresh' }}
            ALGORITHM=${{ vars.ALGORITHM || 'HS256' }}
            REFRESH_ALGORITHM=${{ vars.REFRESH_ALGORITHM || 'HS256' }}
            TOKEN_EXPIRE_MINUTES=30
            REFRESH_TOKEN_EXPIRE_MINUTES=1440
            PGADMIN_DEFAULT_EMAIL=admin@example.com
            PGADMIN_DEFAULT_PASSWORD=example123
            BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            EOF

            echo "${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull backend
            docker compose up -d --remove-orphans backend pgadmin4 main_db
